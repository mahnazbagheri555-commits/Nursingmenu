<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بانک سوالات پرستاری بیماری کودکان</title>
<style>
:root{
  --bg:#0b1220;--panel:#121d30;--panel2:#17253b;--text:#edf3fb;--muted:#a9b8cc;
  --accent:#65d6c4;--line:#2b3b53;--good:#153d34;--bad:#4b2730;--tab:#1e3a5f;
  --header-bg:linear-gradient(135deg,#182943,#102033);
}
[data-theme="light"]{
  --bg:#f0f4f8;--panel:#ffffff;--panel2:#e8eef5;--text:#1a2332;--muted:#5a6a7e;
  --accent:#0d9488;--line:#c5d0de;--good:#d1fae5;--bad:#fee2e2;--tab:#ccfbf1;
  --header-bg:linear-gradient(135deg,#e0f2fe,#f0f9ff);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.9;transition:background .3s,color .3s}
.wrap{max-width:1100px;margin:auto;padding:22px 14px 60px}
header{padding:24px 20px;border:1px solid var(--line);border-radius:20px;background:var(--header-bg);margin-bottom:18px;position:relative}
h1{font-size:clamp(20px,4vw,28px);margin:0 0 8px}
header p{color:var(--muted);margin:0;font-size:14px}
.theme-btn{position:absolute;left:18px;top:18px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px}
.theme-btn:hover{border-color:var(--accent)}

.main-tabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.main-tab{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 18px;cursor:pointer;font:inherit;font-size:15px;transition:.15s}
.main-tab.active{background:#17463f;border-color:#2b7469;color:#fff;font-weight:bold}
[data-theme="light"] .main-tab.active{background:#0d9488;border-color:#0f766e}
.main-tab:hover{border-color:var(--accent)}

.sub-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sub-btn{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;font:inherit;font-size:13px}
.sub-btn.active{background:#1a4a42;border-color:#2f8c77;color:#fff}
[data-theme="light"] .sub-btn.active{background:#14b8a6;color:#fff}
.sub-btn:hover{border-color:var(--accent);color:var(--text)}

.tools{display:grid;grid-template-columns:1fr 180px auto;gap:10px;margin:12px 0}
.tools input,.tools select,.tools button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}
.tools button{cursor:pointer;background:#17463f;border-color:#2b7469;color:#fff}
[data-theme="light"] .tools button{background:#0d9488}
.tools button:hover{opacity:.9}
.stats{color:var(--muted);font-size:13px;margin:6px 2px 12px}

.question{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:12px 0;padding:17px}
.meta{font-size:12px;color:var(--accent);margin-bottom:6px}
.qtitle{font-size:16px;font-weight:bold;margin-bottom:10px}
.opts{display:grid;gap:7px}
.opt{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--accent)}
.opt.correct{background:var(--good);border-color:#2f8c77}
.opt.wrong{background:var(--bad);border-color:#a33}
.opt.disabled{pointer-events:none}
.opt .letter{font-weight:bold;color:var(--accent);margin-left:7px}
@keyframes fireFlash{0%{filter:none}15%{filter:brightness(1.4) sepia(1) hue-rotate(-50deg) saturate(4)}30%{filter:brightness(.7)}45%{filter:brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(5)}60%{filter:brightness(.8)}75%{filter:brightness(1.3) sepia(1) hue-rotate(-40deg) saturate(4)}100%{filter:none}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-8px,4px)}20%{transform:translate(7px,-5px)}30%{transform:translate(-6px,3px)}40%{transform:translate(8px,2px)}50%{transform:translate(-4px,-4px)}60%{transform:translate(5px,3px)}70%{transform:translate(-7px,-2px)}80%{transform:translate(4px,5px)}90%{transform:translate(-3px,-3px)}}
body.on-fire{animation:fireFlash 1.8s ease-in-out,screenShake .7s ease-in-out}
.fire-overlay{position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(ellipse at bottom,rgba(255,80,0,.4) 0%,transparent 55%),radial-gradient(ellipse at 20% 85%,rgba(255,40,0,.35) 0%,transparent 45%),radial-gradient(ellipse at 80% 75%,rgba(255,120,0,.3) 0%,transparent 45%);opacity:0;transition:opacity .25s}
.fire-overlay.active{opacity:1;animation:firePulse .35s ease-in-out infinite alternate}
@keyframes firePulse{from{opacity:.65}to{opacity:1}}
.emoji-rain{position:fixed;top:-70px;z-index:9999;pointer-events:none;font-size:44px;user-select:none;animation:fall linear forwards;filter:drop-shadow(0 0 8px rgba(255,80,0,.9))}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}75%{opacity:1}100%{transform:translateY(115vh) rotate(720deg);opacity:0}}
.flame-sticker{position:fixed;z-index:9997;pointer-events:none;font-size:72px;animation:flameBurst 2.4s ease-out forwards}
@keyframes flameBurst{0%{transform:scale(.2) translateY(0);opacity:0}15%{transform:scale(1.5) translateY(-15px);opacity:1}40%{transform:scale(1.15) translateY(-45px);opacity:.95}100%{transform:scale(.5) translateY(-100px);opacity:0}}
.answer{display:none;margin-top:12px;padding:11px 13px;background:#102f2a;border-right:4px solid var(--accent);border-radius:8px}
[data-theme="light"] .answer{background:#ccfbf1}
.answer.show{display:block}
.note{font-size:13px;color:#c2d1e3;margin-top:6px}
[data-theme="light"] .note{color:#334155}
.dup-badge{display:inline-block;background:#3a2a15;color:#f0c060;font-size:11px;padding:2px 8px;border-radius:6px;margin-right:6px}
[data-theme="light"] .dup-badge{background:#fef3c7;color:#92400e}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.smallbtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;font:inherit;font-size:13px}
.smallbtn:hover{border-color:var(--accent)}
.empty{display:none;text-align:center;color:var(--muted);padding:40px}
.bp-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.bp-card h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
.bp-card .src-ref{font-size:12px;color:var(--muted);margin-top:6px}
.bp-match{background:#1a3a2a;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px}
[data-theme="light"] .bp-match{background:#d1fae5}
@media(max-width:700px){.tools{grid-template-columns:1fr}.main-tabs{gap:6px}.main-tab{padding:9px 12px;font-size:13px}}
</style>
</head>
<body>
<div class="fire-overlay" id="fireOverlay"></div>
<div class="wrap">
<header>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 حالت روشن</button>
  <h1>بانک سوالات پرستاری بیماری کودکان</h1>
  <p>مجموعه سوالات میان‌ترم و پایان‌ترم + بلوپرینت‌ها (دکتر فرشباف) | با پاسخ پیشنهادی بر اساس Wong و نلسون | جست‌وجو · فیلتر · تم تیره/روشن · افکت اشتباه</p>
</header>

<div class="main-tabs">
  <button class="main-tab active" data-main="blueprint">بلوپرینت‌ها</button>
  <button class="main-tab" data-main="questions">سوالات (بر اساس سال)</button>
  <button class="main-tab" data-main="all">همه سوالات (بدون تکرار)</button>
</div>

<div class="sub-tools" id="subTools"></div>

<div class="tools">
  <input id="search" placeholder="جست‌وجو در متن سؤال یا گزینه‌ها…" aria-label="جست‌وجو">

    <option value="">همه انواع</option>
    <option value="mcq">چهارگزینه‌ای</option>
  </select>
  <button id="toggleAll">نمایش همه پاسخ‌ها</button>
</div>
<div class="stats" id="stats"></div>
<div id="list"></div>
<div class="empty" id="empty">سؤالی با این فیلتر پیدا نشد.</div>
</div>

/* ========== منطق نمایش ========== */
let currentMain = "blueprint";
let currentSrc = "";
let allShown = false;

function getSources(main) {
  if (main === "all") return [];
  const set = new Set();
  data.forEach(d => {
    if (main === "blueprint" && d.group === "blueprint") set.add(d.year || d.src);
    if (main === "questions" && d.group === "questions") set.add(d.year || d.src);
  });
  return [...set];
}

function yearLabel(y) {
  const map = {
    "1402-1403": "بلوپرینت / سوالات ۱۴۰۲-۱۴۰۳",
    "1403-di": "بلوپرینت دی ۱۴۰۳",
    "1403": "قلب و کلیه ۱۴۰۳",
    "1403-1404": "سوالات ۱۴۰۳-۱۴۰۴"
  };
  return map[y] || y;
}

function renderSubTools() {
  const box = document.getElementById("subTools");
  if (currentMain === "all") {
    box.innerHTML = '<button class="sub-btn active" data-src="">همه سوالات یکتا (بدون تکرار)</button>';
    return;
  }
  const srcs = getSources(currentMain);
  let html = `<button class="sub-btn ${!currentSrc ? 'active' : ''}" data-src="">همه فایل‌های این بخش</button>`;
  srcs.forEach(s => {
    html += `<button class="sub-btn ${currentSrc === s ? 'active' : ''}" data-src="${esc(s)}">${esc(yearLabel(s))}</button>`;
  });
  box.innerHTML = html;
  box.querySelectorAll(".sub-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSrc = btn.dataset.src || "";
      renderSubTools();
      render();
    });
  });
}

function dedupeKey(item) {
  const q = (item.q || "").replace(/\s+/g, " ").trim();
  const opts = (item.opts || []).join("|");
  return q + "||" + opts;
}

function getFiltered() {
  const term = document.getElementById("search").value.trim().toLowerCase();
  const typeF = document.getElementById("typeFilter").value;
  let list = data.slice();

  if (currentMain === "all") {
    const map = new Map();
    list.forEach(item => {
      const key = dedupeKey(item);
      if (!map.has(key)) {
        map.set(key, { ...item, sources: [item.src] });
      } else {
        const existing = map.get(key);
        if (!existing.sources.includes(item.src)) existing.sources.push(item.src);
      }
    });
    list = [...map.values()];
  } else if (currentMain === "blueprint") {
    list = list.filter(d => d.group === "blueprint");
    if (currentSrc) list = list.filter(d => (d.year || d.src) === currentSrc);
  } else {
    list = list.filter(d => d.group === "questions");
    if (currentSrc) list = list.filter(d => (d.year || d.src) === currentSrc);
  }

  if (typeF) list = list.filter(d => d.type === typeF);
  if (term) {
    list = list.filter(d => {
      const text = (d.q + " " + (d.opts || []).join(" ") + " " + (d.note || "")).toLowerCase();
      return text.includes(term);
    });
  }
  return list;
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const filtered = getFiltered();
  document.getElementById("stats").textContent = `${filtered.length} سؤال نمایش داده شده`;
  document.getElementById("empty").style.display = filtered.length ? "none" : "block";

  document.getElementById("list").innerHTML = filtered.map((x) => {
    const srcLabel = currentMain === "all" && x.sources
      ? x.sources.map(s => `<span class="dup-badge">${esc(s)}</span>`).join(" ")
      : `<span class="meta">${esc(x.src)}</span>`;

    const matchHtml = x.match
      ? `<div class="bp-match">📌 تطابق با فایل‌های سوال: ${esc(x.match)}</div>`
      : "";

    const optsHtml = (x.opts || []).map((o, j) =>
      `<div class="opt ${allShown && j === x.ans ? "correct" : ""}" data-idx="${j}" data-correct="${x.ans}"><span class="letter">${letters[j]})</span>${esc(o)}</div>`
    ).join("");

    return `<article class="question" data-ans="${x.ans}">
      <div class="meta">${srcLabel} · چهارگزینه‌ای</div>
      <div class="qtitle">${esc(x.q)}</div>
      <div class="opts">${optsHtml}</div>
      ${matchHtml}
      <div class="answer ${allShown ? "show" : ""}">
        <b>پاسخ صحیح: ${letters[x.ans]}) ${esc((x.opts || [])[x.ans] || "")}</b>
        ${x.note ? `<div class="note">${esc(x.note)}</div>` : ""}
      </div>
      <div class="controls">
        <button class="smallbtn" onclick="toggleAns(this)">${allShown ? "پنهان کردن پاسخ" : "نمایش پاسخ"}</button>
      </div>
    </article>`;
  }).join("");

  document.querySelectorAll(".question .opt").forEach(opt => {
    opt.addEventListener("click", function() {
      const q = this.closest(".question");
      if (q.dataset.answered === "1") return;
      const correctIdx = parseInt(this.dataset.correct, 10);
      const chosenIdx = parseInt(this.dataset.idx, 10);
      q.dataset.answered = "1";
      q.querySelectorAll(".opt").forEach(o => o.classList.add("disabled"));
      if (chosenIdx === correctIdx) {
        this.classList.add("correct");
      } else {
        this.classList.add("wrong");
        const correctOpt = q.querySelector(`.opt[data-idx="${correctIdx}"]`);
        if (correctOpt) correctOpt.classList.add("correct");
        triggerFireEffect();
      }
    });
  });
}

function triggerFireEffect() {
  const overlay = document.getElementById("fireOverlay");
  document.body.classList.add("on-fire");
  if (overlay) overlay.classList.add("active");
  const flameEmojis = ["🔥","🔥","💥","🔥","🌶️"];
  for (let i = 0; i < 18; i++) {
    const f = document.createElement("div");
    f.className = "flame-sticker";
    f.textContent = flameEmojis[i % flameEmojis.length];
    f.style.left = (Math.random() * 92 + 2) + "vw";
    f.style.top = (Math.random() * 75 + 10) + "vh";
    f.style.fontSize = (48 + Math.random() * 48) + "px";
    f.style.animationDelay = (Math.random() * 0.5) + "s";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 2600);
  }
  const rainEmojis = ["🍆","🍆","🔥","🍆","💥","🍆","🔥","🍆"];
  for (let i = 0; i < 35; i++) {
    const e = document.createElement("div");
    e.className = "emoji-rain";
    e.textContent = rainEmojis[i % rainEmojis.length];
    e.style.left = (Math.random() * 96 + 1) + "vw";
    e.style.fontSize = (28 + Math.random() * 36) + "px";
    e.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    e.style.animationDelay = (Math.random() * 0.9) + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 4000);
  }
  setTimeout(() => {
    document.body.classList.remove("on-fire");
    if (overlay) overlay.classList.remove("active");
  }, 2200);
}

function toggleAns(btn) {
  const q = btn.closest(".question");
  const a = q.querySelector(".answer");
  a.classList.toggle("show");
  btn.textContent = a.classList.contains("show") ? "پنهان کردن پاسخ" : "نمایش پاسخ";
  if (a.classList.contains("show")) {
    const ans = q.dataset.ans;
    if (ans !== "" && ans !== undefined) {
      q.querySelectorAll(".opt").forEach(o => {
        o.classList.remove("wrong");
        if (parseInt(o.dataset.idx, 10) === parseInt(ans, 10)) o.classList.add("correct");
        o.classList.add("disabled");
      });
      q.dataset.answered = "1";
    }
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute("data-theme") === "light";
  if (isLight) {
    html.removeAttribute("data-theme");
    document.getElementById("themeBtn").textContent = "🌙 حالت روشن";
  } else {
    html.setAttribute("data-theme", "light");
    document.getElementById("themeBtn").textContent = "☀️ حالت تیره";
  }
}

document.querySelectorAll(".main-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentMain = tab.dataset.main;
    currentSrc = "";
    renderSubTools();
    render();
  });
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("typeFilter").addEventListener("change", render);
document.getElementById("toggleAll").addEventListener("click", () => {
  allShown = !allShown;
  document.getElementById("toggleAll").textContent = allShown ? "پنهان کردن همه پاسخ‌ها" : "نمایش همه پاسخ‌ها";
  render();
});

renderSubTools();
render();
</script>
